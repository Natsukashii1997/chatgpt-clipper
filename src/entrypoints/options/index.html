<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI 回答收藏器 · 设置</title>
<meta name="manifest.open_in_tab" content="true">
<style>
body{margin:0;background:#f7f7f5;color:#1f1f1f;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
main{max-width:560px;margin:72px auto;padding:0 24px}
h1{font-size:20px;margin:0 0 6px}
.hint{color:#6b6b6b;margin:0 0 24px}
.row{display:flex;align-items:center;gap:12px;padding:16px 18px;background:#fff;border:1px solid #e4e4e0;border-radius:10px}
#cur{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cur.none{color:#9a9a9a;font-weight:400}
button{font:inherit;padding:6px 14px;border-radius:7px;border:1px solid #d0d0cb;background:#fff;cursor:pointer}
button.primary{background:#1f1f1f;color:#fff;border-color:#1f1f1f}
button[hidden]{display:none}
#msg{margin:12px 2px 0;color:#6b6b6b;font-size:13px}
#msg.warn{color:#b45309}
h1.next{margin-top:44px}
#where{flex:1;font:inherit;border:0;outline:none;background:transparent;min-width:0}
#whereMsg{margin:12px 2px 0;color:#6b6b6b;font-size:13px}
#whereMsg.ok{color:#10a37f}#whereMsg.warn{color:#b45309}
.foot{display:flex;align-items:center;gap:12px;margin-top:44px;color:#9a9a9a;font-size:13px}
.foot span{flex:1}
.foot button{font-size:13px;padding:4px 12px}
#diagOut{margin:12px 0 0;padding:12px 14px;background:#fff;border:1px solid #e4e4e0;border-radius:10px;font:12px/1.7 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:#1f1f1f}
#diagOut[hidden]{display:none}
</style>
</head>
<body>
<main>
  <h1>收藏存到哪里</h1>
  <p class="hint">选 Obsidian Vault 里的一个文件夹（建议 <code>00 待整理/ChatGPT收藏</code>，可在弹窗里新建）。每次收藏会在里面新建一个子文件夹，放笔记和长图。</p>
  <div class="row">
    <span id="cur" class="none">未选择</span>
    <button id="reauth" class="primary" hidden>重新授权</button>
    <button id="pick">选择文件夹</button>
  </div>
  <p id="msg"></p>

  <h1 class="next">在 Obsidian 里打开</h1>
  <p class="hint">填上面这个文件夹在 Obsidian 里的位置：第一段是 Vault 的名字，后面是它在 Vault 里的路径。填好后，收藏完点进度卡上的绿色横条，就能在 Obsidian 里打开这篇笔记。</p>
  <div class="row"><input id="where" placeholder="例如：Obsidian Vault/00 待整理/ChatGPT收藏"></div>
  <p id="whereMsg"></p>

  <div class="foot"><span id="build"></span><button id="diag">自检</button></div>
  <pre id="diagOut" hidden></pre>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
